<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Farm Tour</title>

<style>
    body{
        font-family:Arial, Helvetica, sans-serif;
        background-color:lightcoral;
    }
    h1{
        color:beige;
    }
    h2{
        color:bisque;
    }
</style>
</head>

<body>

    <header>
    <h1>
        Book a Farm Tour
    </h1>
    <p>
        Welcome to Green Hills Coffee Plantation.
        Fill in the form below to book your visit.
    </p>
    </header>
    <h2>Tour Booking Form</h2>
    <form>
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" required>
        <br><br>
        
        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" required>
        <br><br>
        
        <label for="date">Prefered Tour Date</label><br>
    <input type="date" id="date" name="date" required>
    <br><br>

    <button type="submit">Book Tour</button>
    </form>

    <p>
        <a href="home.html">home</a>
    </p>
    <footer>
        <p>&copy;2026 Green Hills Coffee Plantation</p>
    </footer>
</body>
</html>
